name: Shef playback diagnostic
on:
  push:
    branches: [diagnostic/shef-20261121]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Decode audio and video
        run: timeout 35 ffmpeg -nostdin -hide_banner -loglevel error -xerror -i 'https://cdn-dvr.ntv.ru/Shef/tracks-v1a1/rewind-240.ts.m3u8' -map 0:v:0 -map 0:a:0 -t 5 -progress pipe:1 -f null -
      - name: Run project checker on identical URL
        if: always()
        run: |
          python - <<'PY'
          import refresh as r
          print(r.check_stream('https://cdn-dvr.ntv.ru/Shef/tracks-v1a1/rewind-240.ts.m3u8', r.Fetcher()))
          PY
