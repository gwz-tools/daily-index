name: Daily index

on:
  schedule:
    # 03:17 UTC = 06:17 Moscow. Scheduled starts can be delayed by GitHub.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Regression and media tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Refresh
        id: build
        continue-on-error: true
        run: python refresh.py

      - name: Validate result
        if: steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from refresh import parse_m3u, url_policy

          c = json.loads(Path('sources.json').read_text('utf-8'))
          s = json.loads(Path(c['report']).read_text('utf-8'))

          raw = Path(c['output']).read_bytes()
          text = raw.decode('utf-8')

          # The first four hand-maintained groups are an immutable prefix.
          # Validate this block byte-for-byte and count EXTINF records directly.
          # Do not re-parse the fixed block: it is intentionally preserved
          # exactly and may contain legacy M3U syntax.
          fixed = Path('fixed_prefix.m3u').read_text(
              encoding='utf-8-sig'
          ).strip() + '\n'

          assert text.startswith(fixed), 'fixed prefix changed or moved'

          fixed_count = fixed.count('#EXTINF:')
          total_count = text.count('#EXTINF:')

          dynamic_text = text[len(fixed):]
          dynamic_entries = list(parse_m3u(dynamic_text))
          dynamic_count = dynamic_text.count('#EXTINF:')

          assert s['status'] == 'ok'
          assert total_count == s['working_channels'] > 0
          assert fixed_count == s['fixed_channels'] > 0

          # Every generated dynamic EXTINF must be parseable.
          assert (
              dynamic_count
              == len(dynamic_entries)
              == s['verified_dynamic_channels']
              > 0
          ), 'dynamic channel count mismatch'

          assert (
              hashlib.sha256(raw).hexdigest()
              == s['playlist_sha256']
          )

          # Dynamic output must stay strict and deduplicated.
          assert (
              len({e.url for e in dynamic_entries})
              == len(dynamic_entries)
          )

          for e in dynamic_entries:
              url_policy(e.url)
              assert not e.unsafe_options
              assert e.language == 'Russian'

          # Required fixed groups must remain in this exact order.
          required = [
              '📺 Общие каналы WINK 🇷🇺',
              '▶️ Rutube (VPN)',
              '🏆 Спорткомплекс',
              '📷 КАМЕРЫ (ONLINE)',
          ]

          positions = [
              fixed.find(f'group-title="{name}"')
              for name in required
          ]

          assert all(p >= 0 for p in positions)
          assert positions == sorted(positions)
          PY

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: strict_status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified output
        if: steps.build.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add playlistRU.m3u strict_state.json strict_status.json

          if git diff --cached --quiet; then
            exit 0
          fi

          built_from=$(git rev-parse HEAD)
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$built_from" ]; then
            echo 'The source changed during this run; refusing stale output. Run again.'
            exit 1
          fi

          git commit -m 'Refresh verified index'
          git push origin HEAD:main

      - name: Update existing Dropbox playlist
        if: steps.build.outcome == 'success'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo 'Repository changed after this build; refusing a stale Dropbox update.'
            exit 1
          fi

          python publish_dropbox.py

      - name: Mark unsuccessful refresh
        if: steps.build.outcome != 'success'
        run: |
          echo 'No new verified index published. See the run-report artifact; existing output retains its previous check date.'
          exit 1
