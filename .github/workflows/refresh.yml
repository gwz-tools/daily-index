name: Daily index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'verify_fixed_sports.py'
      - 'refresh.py'
      - 'test_refresh.py'
      - 'fixed_prefix.m3u'
  schedule:
    # 00:00 UTC = 03:00 Moscow. Scheduled starts can be delayed by GitHub.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Regression and media tests
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Apply runtime priorities and aliases
        run: python apply_runtime_overrides.py

      - name: Verify fixed sports streams
        run: |
          python verify_fixed_sports.py
          # Keep non-sport fixed groups intact and import only verified
          # sport streams into the regular dynamic Sport section.
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('extra_sources.json')
          cfg = json.loads(path.read_text('utf-8'))
          cfg['fixed_prefix'] = 'fixed_prefix_checked.m3u'
          cfg['sports_verified_file'] = 'sports_verified.m3u'
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Refresh
        id: build
        continue-on-error: true
        run: python refresh.py

      - name: Validate result
        if: steps.build.outcome == 'success'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          from refresh import parse_m3u, url_policy

          c = json.loads(Path('sources.json').read_text('utf-8'))
          s = json.loads(Path(c['report']).read_text('utf-8'))

          raw = Path(c['output']).read_bytes()
          text = raw.decode('utf-8')

          # Non-sport groups are immutable. The Sports Complex subset is
          # restricted to streams verified by actual media decoding.
          # Count EXTINF records directly: fixed groups may use legacy syntax.
          from verify_fixed_sports import split_records, is_sport

          original = Path('fixed_prefix.m3u').read_text(
              encoding='utf-8-sig'
          ).strip() + '\n'
          fixed = Path('fixed_prefix_checked.m3u').read_text(
              encoding='utf-8-sig'
          ).strip() + '\n'
          sport_report = json.loads(Path('sports_status.json').read_text('utf-8'))
          oh, orows = split_records(original)
          vh, vrows = split_records(fixed)
          sports = Path('sports_verified.m3u').read_text('utf-8-sig')
          verified_sports = list(parse_m3u(sports))
          assert sport_report['status'] == 'ok'
          assert sport_report['verified_sports'] > 0
          assert oh == vh, 'original playlist header changed'
          assert [r for r in orows if not is_sport(r)] == vrows, (
              'non-sport fixed groups were changed'
          )
          assert not any(is_sport(r) for r in vrows)
          assert len(verified_sports) == sport_report['verified_sports']
          assert set(vrows).issubset(set(orows)), 'unknown stream added to fixed prefix'
          assert text.startswith(fixed), 'fixed prefix changed or moved'

          fixed_count = fixed.count('#EXTINF:')
          total_count = text.count('#EXTINF:')

          dynamic_text = text[len(fixed):]
          dynamic_entries = list(parse_m3u(dynamic_text))
          dynamic_count = dynamic_text.count('#EXTINF:')

          assert any(e.group == '⚽ Спорт' for e in dynamic_entries), (
              'verified sport missing from unified Sport group'
          )
          from refresh import sport_bucket
          sport_order = [
              sport_bucket(e.name) for e in dynamic_entries
              if e.group == '⚽ Спорт'
          ]
          assert sport_order == sorted(sport_order), (
              'Sport order must be KHL, volleyball, football, other'
          )

          assert s['status'] == 'ok'
          assert total_count == s['working_channels'] > 0
          assert fixed_count == s['fixed_channels'] > 0

          # Every generated dynamic EXTINF must be parseable.
          assert (
              dynamic_count
              == len(dynamic_entries)
              == s['verified_dynamic_channels']
              > 0
          ), 'dynamic channel count mismatch'

          assert (
              hashlib.sha256(raw).hexdigest()
              == s['playlist_sha256']
          )

          # Dynamic output must stay strict and deduplicated.
          assert (
              len({e.url for e in dynamic_entries})
              == len(dynamic_entries)
          )

          for e in dynamic_entries:
              url_policy(e.url)
              assert not e.unsafe_options
              assert e.language == 'Russian'

          # Public titles and tvg-name are canonical: round-bracket quality
          # and service annotations are deliberately removed for EPG/logos.
          for line in dynamic_text.splitlines():
              if not line.startswith('#EXTINF:'):
                  continue
              shown = line.split(',', 1)[1]
              tvg_name = re.search(r'tvg-name="([^"]*)"', line)
              assert tvg_name, 'dynamic entry has no tvg-name'
              assert '(' not in shown and ')' not in shown
              assert '(' not in tvg_name.group(1) and ')' not in tvg_name.group(1)

          # Required fixed groups must remain in this exact order.
          required = [
              '📺 Общие каналы WINK 🇷🇺',
              '▶️ Rutube (VPN)',
              '📷 КАМЕРЫ (ONLINE)',
          ]

          positions = [
              fixed.find(f'group-title="{name}"')
              for name in required
          ]

          assert all(p >= 0 for p in positions)
          assert positions == sorted(positions)
          PY

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: |
            strict_status.json
            sports_status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified output
        if: steps.build.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add playlistRU.m3u strict_state.json strict_status.json sports_status.json

          if git diff --cached --quiet; then
            exit 0
          fi

          built_from=$(git rev-parse HEAD)
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$built_from" ]; then
            echo 'The source changed during this run; refusing stale output. Run again.'
            exit 1
          fi

          git commit -m 'Refresh verified index'
          git push origin HEAD:main

      - name: Update existing Dropbox playlist
        if: steps.build.outcome == 'success'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo 'Repository changed after this build; refusing a stale Dropbox update.'
            exit 1
          fi

          python publish_dropbox.py

      - name: Mark unsuccessful refresh
        if: steps.build.outcome != 'success'
        run: |
          echo 'No new verified index published. See the run-report artifact; existing output retains its previous check date.'
          exit 1
